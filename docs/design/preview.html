    @container (max-width:599px){.hero{gap:16px;margin-bottom:24px}.hero>div>.kicker{display:none}.hero h1{font-size:30px;margin-bottom:12px}.hero .lead{font-size:16px;line-height:1.5}.continue .kicker{display:none}.continue .small{margin-bottom:10px}.library-controls{grid-template-columns:minmax(0,1fr) auto}.search{grid-column:1/-1}.stage-select{max-width:112px;padding:8px;font-size:13px}.filters{gap:0}.filter{padding:8px 10px;font-size:13px}}
    @container (max-width:359px){.library-controls{grid-template-columns:1fr}.stage-select{max-width:100%}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

    .stage{color-scheme:light;accent-color:var(--primary)}

    .stage .button:disabled,.stage .icon-btn:disabled{opacity:1;color:var(--disabled-ink);background:var(--disabled-bg);border-color:var(--line)}
    .stage .answer[aria-pressed=true],.stage .filter[aria-pressed=true]{border-color:var(--selected-border);background:var(--highlight);color:var(--accent)}
    .stage .icon-btn[data-utterance][aria-label^="Stop:"]{border-color:var(--selected-border);background:var(--highlight);color:var(--accent)}
    .stage .switch[aria-checked=true]:before{background:var(--on-primary)}
    .semantic{background:var(--record)}
  </style>

<body>
  <header class="review-bar">
    <div><strong>Basic English · 设计方案</strong><small>暖白与深绿 · 阅读与生活插画</small></div>
    <div class="review-controls" aria-label="Design preview controls">
      <label class="sr-only" for="screen">Preview page</label><select id="screen"><option value="words">绘本目录</option><option value="reader">绘本阅读</option><option value="today">Today</option><option value="course">Course</option><option value="review">Review</option><option value="me">Me</option><option value="system">色彩与组件</option></select>
      <button data-size="desktop" aria-pressed="true">桌面</button><button data-size="mobile" aria-pressed="false">390px</button><button data-size="narrow" aria-pressed="false">320px</button>
      <button id="theme-toggle" aria-pressed="false">深色</button><button id="chinese-toggle" aria-pressed="false">中文帮助</button><a class="spec-link" href="../../DESIGN.md">完整规范 ↗</a>
    </div>
  </header>
  <p class="review-note">交互设计预览 · 进度为示意数据，书架展示 8 本真实内容样例 · 不更改应用记录，不播放实际声音</p>
  <div class="stage" id="stage" data-theme="light" data-size="desktop"><div class="app-shell" id="app"></div></div>
  <div id="notice" role="status" class="live-note" hidden></div>
  <script src="preview-data.js"></script>
  <script>
    const stage=document.getElementById('stage'),app=document.getElementById('app');
    const iconPaths={book:'<path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Z"/><path d="M12 5v15"/>',home:'<path d="m3 10 9-7 9 7v11H3Z"/><path d="M9 21v-8h6v8"/>',map:'<path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z"/><path d="M9 3v16M15 5v16"/>',review:'<path d="M4 9a8 8 0 1 1 0 6"/><path d="M4 3v6h6M12 7v5l3 2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',sound:'<path d="m11 4-6 5H2v6h3l6 5Z"/><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',pause:'<path d="M8 5v14M16 5v14"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>'};
    const ico=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(iconPaths[name]||iconPaths.book)+'</svg>';
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const asset=file=>'../../src/assets/word-stories/'+file;
    const S={page:'words',mode:'stories',story:'give',index:-1,chinese:false,dark:false,filter:'all',query:'',phase:'all',read:new Set(['friend','under']),saved:{},answer:null,reviewStarted:false,reviewFinished:false,flipped:false,playing:false};
    let noticeTimer;
    function notice(text){const n=document.getElementById('notice');n.textContent=text;n.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.hidden=true,4000)}
    function story(){return sampleStories.find(b=>b.wordId===S.story)||sampleStories[0]}
    function speechButton(label='Listen'){return '<button class="icon-btn" data-action="listen" data-utterance="'+esc(label)+'" aria-label="'+esc((S.playing===label?'Stop: ':'')+label)+'">'+ico(S.playing===label?'pause':'sound')+'</button>'}
    function nav(kind='desktop'){return '<nav class="'+kind+'-nav" aria-label="'+(kind==='desktop'?'Main navigation':'Mobile navigation')+'">'+[['today','Today','home'],['course','Course','map'],['review','Review','review'],['words','Words','book'],['me','Me','user']].map(([id,label,icon])=>'<button class="nav-btn" data-page="'+id+'" '+(S.page===id||S.page==='reader'&&id==='words'?'aria-current="page"':'')+'>'+(kind==='bottom'?ico(icon):'')+label+(id==='review'?'<span class="badge-count">6</span>':'')+'</button>').join('')+'</nav>'}
    function header(){return '<header class="app-header"><a class="brand" href="#today" data-page="today"><span class="brand-mark">'+ico('book')+'</span><span>Basic English<small>850 words. Everyday English.</small></span></a>'+nav()+'</header>'}
    function modes(){return '<div class="modes" role="tablist" aria-label="Words modes">'+[['list','List'],['flashcards','Flashcards'],['library','850 Library'],['stories','Stories']].map(([id,label])=>'<button class="mode" role="tab" tabindex="'+(S.mode===id?'0':'-1')+'" aria-selected="'+(S.mode===id)+'" data-mode="'+id+'">'+label+'</button>').join('')+'</div>'}
    function cover(b){return '<button class="cover" data-book="'+b.wordId+'" aria-label="Read '+esc(b.title)+'"><div class="cover-art"><img src="'+asset(b.pages[0].file)+'" width="512" height="512" loading="lazy" alt="'+esc(b.pages[0].alt)+'">'+(S.read.has(b.wordId)?'<span class="tag">'+ico('check')+'Read</span>':'')+'</div><div class="cover-info"><span class="cover-title">'+esc(b.title)+'</span><span data-zh class="chinese">'+esc(b.titleChinese)+'</span><span class="cover-word">'+esc(b.wordId)+'</span><span class="cover-meta">After Week '+b.week+' · 4 pages</span></div></button>'}
    function filteredBooks(){return sampleStories.filter(b=>(S.filter==='all'||(S.filter==='read')===S.read.has(b.wordId))&&(S.phase==='all'||(b.week>=Number(S.phase.split('-')[0])&&b.week<=Number(S.phase.split('-')[1])))&&((b.title+' '+b.wordId).toLowerCase().includes(S.query.toLowerCase())))}
    function renderGrid(){const list=filteredBooks(),grid=document.getElementById('cover-grid'),count=document.getElementById('result-count');if(!grid)return;count.textContent=list.length+' sample '+(list.length===1?'story':'stories');grid.innerHTML=list.length?list.map(cover).join(''):'<div class="empty" style="grid-column:1/-1"><h3>No stories found</h3><p class="muted">Try another word or clear the filters.</p><button class="button" data-action="clear">Clear filters</button></div>'}
    function words(){if(S.mode!=='stories')return wordModes();const b=sampleStories.find(x=>x.wordId==='give');return '<main class="page" id="main">'+modes()+'<section class="hero"><div><p class="kicker">Words / Stories</p><h1>English in<br>everyday stories.</h1><p class="lead">One word. A short story.<br>Read it, understand it, make it your own.</p><p data-zh class="chinese">在生活小故事里，读懂一个词，再说出自己的句子。</p></div><article class="continue"><img src="'+asset(b.pages[0].file)+'" alt="'+esc(b.pages[0].alt)+'" width="512" height="512"><div><p class="kicker">Continue reading</p><h2>'+esc(b.title)+'</h2><p class="small muted">give · Page 3 of 4</p><button class="button primary" data-action="continue-story">Continue '+ico('arrow')+'</button></div></article></section><section aria-labelledby="all-stories-title"><div class="section-head"><h2 id="all-stories-title">Find your next story</h2><p class="small muted" id="result-count"></p></div><div class="library-controls"><label class="search">'+ico('search')+'<span class="sr-only">Search stories</span><input type="search" id="story-search" placeholder="Search a word or story" value="'+esc(S.query)+'"></label><div class="filters" aria-label="Reading status">'+[['all','All'],['not-read','Not read'],['read','Read']].map(([v,t])=>'<button class="filter" data-filter="'+v+'" aria-pressed="'+(S.filter===v)+'">'+t+'</button>').join('')+'</div><label><span class="sr-only">Reading stage</span><select class="stage-select" id="phase"><option value="all">All stages</option><option value="1-12">Weeks 1–12</option><option value="13-20">Weeks 13–20</option><option value="21-36">Weeks 21–36</option><option value="37-52">Weeks 37–52</option></select></label></div><div class="cover-grid" id="cover-grid"></div><p class="sample-label">8 sample books shown in this preview. The course has 53 stories.</p></section></main>'}
    function wordModes(){const b=sampleStories.find(x=>x.wordId==='give');let body='';if(S.mode==='flashcards')body='<div class="word-card paper"><img src="'+asset(b.pages[2].file)+'" alt="'+esc(b.pages[2].alt)+'"><div><p class="kicker">Word 1 / 8 · Week 3</p><div class="target-line"><strong>give</strong><span>/ɡɪv/</span>'+speechButton('Listen to give')+'</div>'+(S.flipped?'<p class="lead">'+esc(b.definition)+'</p><p>I give a book to my friend.</p><p data-zh class="chinese">我把一本书给我的朋友。</p>':'<h1>A word you can use.</h1><p class="muted">Look at the scene. Listen to the word.</p>')+'<button class="button" data-action="flip">'+(S.flipped?'Show picture':'See the meaning')+'</button></div></div><div class="word-actions"><button class="button" data-action="word-review">Need review</button><button class="button primary" data-action="word-known">I know this</button></div>';else body='<h1>'+(S.mode==='library'?'The 850-word library':'Your course words')+'</h1><p class="lead">A small set of words for everyday life.</p><div class="word-list">'+sampleStories.map(x=>'<article class="word-row"><div><strong>'+x.wordId+'</strong><p>'+esc(x.definition)+'</p></div><button class="button compact" data-book="'+x.wordId+'">Read story</button></article>').join('')+'</div><p class="sample-label">Sample word rows for visual review.</p>';return '<main class="page">'+modes()+body+'</main>'}
    function today(){return '<main class="page"><p class="kicker">Week 3 · Day 17</p><h1>Give something<br>to a friend.</h1><p class="lead">Use a short sentence in your day.</p><p data-zh class="chinese">把学过的词，放进今天能用的一句话。</p><div class="layout-two section"><section class="paper"><div class="row space-between"><h2>Today’s learning</h2><span class="tag">In progress</span></div><p class="small muted">Current stage: Learn</p><button class="button primary" data-action="continue-learning" style="margin-top:4px">Continue learning '+ico('arrow')+'</button><div class="progress-track" aria-label="Sample learning progress"><div class="progress-fill" style="width:35%"></div></div><div class="steps">'+[['Review','Words you have seen','check'],['Learn','Words and useful sentences','2'],['Practice','Listen and make a sentence','3'],['Use it','Say something about your day','4']].map(([t,d,n],i)=>'<div class="step '+(i===1?'active':'')+'"><span class="step-index">'+(n==='check'?ico('check'):n)+'</span><div><strong>'+t+'</strong><p>'+d+'</p></div>'+(i===1?'<span class="tag">Continue here</span>':'')+'</div>').join('')+'</div></section><aside><section class="aside"><p class="kicker">This week</p><h3>Small actions,<br>real conversations.</h3><p class="muted">Learn to talk about time and the things you do each day.</p><div class="row"><span class="tag">2 days completed</span></div><button class="button quiet" data-page="course">View your course '+ico('arrow')+'</button></section><section class="section"><h3>A story for this week</h3><button class="cover" data-book="give"><div class="continue" style="background:transparent;padding:0"><img src="'+asset('give-1.webp')+'" alt="A boy has a book near his friend."><div><strong>A book for my friend</strong><p class="small muted" style="margin:5px 0">give · 4 pages</p><span class="small" style="color:var(--accent)">Read story →</span></div></div></button></section></aside></div></main>'}
    function course(){return '<main class="page panel-narrow"><p class="kicker">Your learning path</p><h1>Every week,<br>a little more to say.</h1><p class="lead">52 weeks of English for everyday life.</p><div class="progress-track"><div class="progress-fill" style="width:5%"></div></div><p class="small muted">Sample progress · 16 days completed</p>'+[['1','People and introductions','Completed'],['2','My room','Completed'],['3','Every day and time','Current week'],['4','Food and needs','Locked']].map(([n,t,status])=>'<details class="week" '+(n==='3'?'open':'')+'><summary><div><h2>Week '+n+' · '+t+'</h2><small>'+(n==='3'?'2 / 7 days completed':status)+'</small></div><span class="tag '+(n==='4'?'warning':'')+'">'+(n==='4'?ico('lock'):n==='3'?'Current':ico('check'))+'</span></summary><div style="padding-top:12px">'+(n==='4'?'<p class="muted">Complete Week 3 to unlock this week.</p>':n!=='3'?'<p class="muted">This week is completed in the preview.</p>':[['15','Things I do each day','Completed'],['16','Talk about time','Completed'],['17','Give something to a friend','Current'],['18','My day at home','Locked']].map(([d,title,st])=>'<article class="day-row '+(st==='Current'?'current':'')+'"><span class="step-index">'+(st==='Completed'?ico('check'):st==='Locked'?ico('lock'):d)+'</span><div class="grow"><strong>Day '+d+'</strong><p>'+title+'</p></div>'+(st==='Current'?'<button class="button primary compact" data-page="today">Continue</button>':'<span class="small muted">'+st+'</span>')+'</article>').join(''))+'</div></details>').join('')+'<p class="sample-label">Four sample weeks. Full course content and unlocking rules remain unchanged.</p></main>'}
    function review(){let body;if(S.reviewFinished)body='<div class="review-start"><span class="tag">'+ico('check')+'Session complete</span><h1 style="margin-top:24px">A little practice<br>goes a long way.</h1><p class="lead">You reviewed one sample word.</p><button class="button primary" data-page="today">Back to Today '+ico('arrow')+'</button></div>';else if(S.reviewStarted)body='<p class="kicker">Word review · 1 / 6</p><h1>Use a word you know.</h1><div class="paper section"><p class="question">I ___ a book to my friend.</p><div class="answers"><button class="button answer" data-action="review-answer" data-value="give">give</button><button class="button answer" data-action="review-answer" data-value="under">under</button></div><div id="review-feedback" role="status"></div></div>';else body='<p class="kicker">A little practice</p><h1>Keep useful English<br>close at hand.</h1><section class="review-start"><p class="muted">Due for review</p><div class="queue-number">6</div><p class="lead">Words and scenes to practise again.</p><button class="button primary" data-action="start-review">Start review '+ico('arrow')+'</button></section><div class="section" style="border-top:1px solid var(--line);padding-top:24px"><h3>One thing at a time</h3><p class="muted">Listen, remember, and try it in a sentence.</p></div>';return '<main class="page panel-narrow">'+body+'</main>'}
    function reader(){const b=story(),intro=S.index<0,check=S.index===b.pages.length;let content;if(intro)content='<section class="reader-intro"><img src="'+asset(b.pages[0].file)+'" alt="'+esc(b.pages[0].alt)+'"><div><p class="kicker">Read after Week '+b.week+' · 4 pages</p><h1>'+esc(b.title)+'</h1><p data-zh class="chinese">'+esc(b.titleChinese)+'</p><div class="target-line"><strong>'+b.wordId+'</strong><span>'+esc(b.phonetic)+'</span>'+speechButton('Listen to '+b.wordId)+'</div><p class="lead">'+esc(b.definition)+'</p><p data-zh class="chinese">'+esc(b.definitionChinese)+'</p><details class="reader-help"><summary>Words to read again</summary><p>'+b.reviewWordIds.join(' · ')+'</p><p class="small">Read these words before the story if you need help.</p></details><button class="button primary" data-action="start-story">Read story '+ico('arrow')+'</button></div></section>';else if(check)content=meaningCheck(b);else{const p=b.pages[S.index];content='<section class="reading-spread" role="region" aria-label="Story page content" tabindex="0"><img class="reading-art" src="'+asset(p.file)+'" alt="'+esc(p.alt)+'" width="512" height="512"><div class="reading-copy"><div class="target-line"><strong>'+b.wordId+'</strong><span>'+esc(b.phonetic)+'</span>'+speechButton('Listen to '+b.wordId)+'</div><p class="narrator">'+esc(b.narrator)+'</p><p class="sentence">'+esc(p.text).replace(new RegExp('\\b('+b.wordId+')\\b','gi'),'<mark>$1</mark>')+'</p><div class="read-action">'+speechButton('Read story page')+'<span class="small">'+(S.playing==='Read story page'?'Playing · preview':'Listen to this page')+'</span></div><p data-zh class="chinese">'+esc(p.chinese)+'</p>'+(p.semanticText?'<aside class="semantic" aria-label="'+esc(p.semanticText.accessibleSummary)+'"><p><strong>'+esc(p.semanticText.label)+'</strong></p>'+p.semanticText.lines.map(l=>'<p>'+esc(l)+'</p>').join('')+'</aside>':'')+'<details class="reader-help"><summary>Word meaning and a little help</summary><p>'+esc(b.definition)+'</p><p class="small">Read again: '+b.reviewWordIds.join(' · ')+'</p></details></div></section><nav class="reader-nav" aria-label="Story pages"><button class="button" data-action="previous" '+(S.index===0?'disabled':'')+'>'+ico('back')+'Previous</button><div class="page-dots" aria-hidden="true">'+b.pages.map((_,i)=>'<i class="'+(i<=S.index?'done':'')+'"></i>').join('')+'</div><span class="small muted">'+(S.index+1)+' / '+b.pages.length+'</span><button class="button primary" data-action="next">'+(S.index===3?'Finish story':'Next page')+ico('arrow')+'</button></nav>'}return '<main class="page reader-page"><div class="reader-top"><button class="button quiet" data-action="back-stories">'+ico('back')+'Back to stories</button><div class="reader-identity"><strong>'+esc(b.title)+'</strong><p class="small muted">'+(intro?'One word, one story':check?'Your turn':b.wordId+' · Page '+(S.index+1))+'</p></div></div>'+content+'</main>'}
    function meaningCheck(b){const correct=S.answer===b.check.correctIndex;return '<section class="check"><p class="kicker">'+ico('check')+' Story read</p><h1>Now make it yours.</h1><p class="question">'+esc(b.check.prompt)+'</p><p data-zh class="chinese">'+esc(b.check.chinese)+'</p><div class="answers">'+b.check.options.map((t,i)=>'<button class="button answer" data-answer="'+i+'" aria-pressed="'+(S.answer===i)+'">'+esc(t)+'</button>').join('')+'</div>'+(S.answer!==null?'<div class="feedback" role="status">'+esc(correct?b.check.success:b.check.retry)+'</div>':'')+(correct?'<section class="practice"><h2>Your own sentence</h2><p class="muted">'+esc(b.practice)+'</p><label for="sentence-input">Your sentence</label><textarea id="sentence-input" placeholder="'+esc(b.practice)+'">'+esc(S.saved[b.wordId]||'')+'</textarea><div class="row" style="margin-top:16px"><button class="button primary" data-action="save-sentence">Save my sentence</button>'+speechButton('Read my sentence')+'</div><p class="small muted" id="save-status" role="status">Saved sentences in this preview last only for this visit.</p></section>':'')+'<div class="section"><button class="button" data-action="word-review">Review this word</button><button class="button quiet" data-action="reread" style="margin-left:16px">Read again</button></div></section>'}
    function me(){return '<main class="page panel-narrow"><p class="kicker">Your learning</p><h1>English you can<br>make your own.</h1><section class="metric-grid section" aria-label="Sample progress"><div class="metric"><strong>16</strong><span>Days completed</span></div><div class="metric"><strong>8</strong><span>Saved sentences</span></div><div class="metric"><strong>3</strong><span>Scenes practised</span></div></section><section class="section"><div class="section-head"><h2>A sentence from your day</h2><span class="small muted">Sample</span></div><blockquote class="quote">I give a cup to my friend.</blockquote><p class="small muted">Your words, used in a real situation.</p></section><section class="section"><h2>Make yourself comfortable</h2><div class="settings"><div class="setting"><div><strong>Chinese help</strong><p>Show Chinese when it helps.</p></div><button class="switch" role="switch" aria-label="Chinese help" aria-checked="'+S.chinese+'" data-action="chinese"></button></div><div class="setting"><div><strong>Theme</strong><p>A quiet space for reading.</p></div><select id="setting-theme" aria-label="Theme"><option value="light" '+(!S.dark?'selected':'')+'>Light</option><option value="dark" '+(S.dark?'selected':'')+'>Dark</option></select></div><div class="setting"><div><strong>Voice and reading</strong><p>Preview sound is always off.</p></div><button class="button compact" data-action="voice-settings">View settings</button></div></div></section></main>'}
    function render(keepScroll=false){const scroll=stage.scrollTop;stage.classList.toggle('in-reader',S.page==='reader');stage.classList.toggle('show-chinese',S.chinese);stage.dataset.theme=S.dark?'dark':'light';document.getElementById('theme-toggle').setAttribute('aria-pressed',S.dark);document.getElementById('chinese-toggle').setAttribute('aria-pressed',S.chinese);document.querySelectorAll('.review-controls [data-size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===stage.dataset.size));document.getElementById('screen').value=S.page==='reader'?'reader':S.page;const content=({words,today,course,review,reader,me,system:designSystem}[S.page]||words)();app.innerHTML=header()+content+nav('bottom');if(S.page==='words'&&S.mode==='stories'){document.getElementById('phase').value=S.phase;renderGrid()}if(S.page==='reader'&&S.index>=0&&S.index<story().pages.length){const title=app.querySelector('.reader-identity strong');const heading=document.createElement('h1');heading.textContent=title.textContent;title.replaceWith(heading)}stage.scrollTop=keepScroll?scroll:0}
    function designSystem(){const palette=[['Warm canvas','--bg',S.dark?'#121714':'#F7F5EF'],['Reading surface','--surface',S.dark?'#1B211D':'#FFFDF8'],['Forest action','--primary',S.dark?'#9DB9A6':'#265C46'],['Primary ink','--ink',S.dark?'#E9EDE9':'#17211A'],['Quiet text','--muted',S.dark?'#A7B6AC':'#496454'],['Word highlight','--highlight',S.dark?'#244033':'#DCEEE6']];return '<main class="page"><p class="kicker">Basic English · Design system</p><h1>A quiet space<br>for useful English.</h1><p class="lead">Warm paper, forest green, and a clear place for every word.</p><section class="section"><h2>Colors with a purpose</h2><div class="metric-grid">'+palette.map(([label,token,hex])=>'<article style="overflow:hidden;border:1px solid var(--line);border-radius:12px"><div style="height:96px;background:var('+token+')"></div><div style="padding:14px"><strong>'+label+'</strong><p class="small muted" style="margin:5px 0 0">'+hex+'</p></div></article>').join('')+'</div></section><div class="layout-two section"><section class="paper"><p class="kicker">Type and reading</p><h2 style="font-family:Georgia,serif;font-size:32px;font-weight:400">A book for my friend</h2><p class="sentence">I <mark>give</mark> a book to my friend.</p><p class="chinese">我把一本书给我的朋友。</p><p class="small muted">Editorial titles. Clear learning text.<br>Quiet help, close to the sentence.</p></section><section class="aside"><h2>Actions and states</h2><div class="row" style="margin-bottom:16px"><button class="button primary" data-book="give">Read story '+ico('arrow')+'</button><button class="button" data-action="back-stories">All stories</button></div><div class="row">'+speechButton('Listen to an example')+'<button class="button" disabled>Previous</button></div><div class="row" style="margin-top:24px"><span class="tag">'+ico('check')+'Read</span><span class="tag warning">Review due</span></div><p class="small muted" style="margin-top:16px">Reading and word mastery remain separate.</p></section></div></main>'}
    function go(page){const returning=S.page==='reader'&&page==='words';S.playing=false;S.page=page;render();const main=app.querySelector('main');main.tabIndex=-1;main.focus({preventScroll:true});if(returning){stage.scrollTop=S.listScroll||0;const card=app.querySelector('[data-book='+S.story+']');if(card)card.focus({preventScroll:true})}}
    function openBook(word,at=-1){if(S.page==='words')S.listScroll=stage.scrollTop;S.story=word;S.index=at;S.answer=null;S.playing=false;go('reader')}
    function setTheme(dark){S.dark=dark;render(true)}
    function setChinese(){S.chinese=!S.chinese;render(true)}
    document.getElementById('screen').addEventListener('change',e=>{if(e.target.value==='reader')openBook('give',2);else go(e.target.value)});
    document.getElementById('theme-toggle').onclick=()=>setTheme(!S.dark);document.getElementById('chinese-toggle').onclick=setChinese;
    document.querySelectorAll('.review-controls [data-size]').forEach(b=>b.onclick=()=>{stage.dataset.size=b.dataset.size;document.querySelectorAll('.review-controls [data-size]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
    app.addEventListener('input',e=>{if(e.target.id==='story-search'){S.query=e.target.value;renderGrid()}if(e.target.id==='sentence-input')S.saved[S.story]=e.target.value});
    app.addEventListener('change',e=>{if(e.target.id==='phase'){S.phase=e.target.value;renderGrid()}if(e.target.id==='setting-theme')setTheme(e.target.value==='dark')});
    app.addEventListener('click',e=>{const b=e.target.closest('button,a[data-page]');if(!b||b.disabled)return;if(b.dataset.page){e.preventDefault();go(b.dataset.page);return}if(b.dataset.book){openBook(b.dataset.book);return}if(b.dataset.mode){S.mode=b.dataset.mode;render();app.querySelector('.mode[aria-selected=true]').focus();return}if(b.dataset.filter){S.filter=b.dataset.filter;render(true);app.querySelector('[data-filter='+S.filter+']').focus();return}if(b.dataset.answer!==undefined){S.answer=Number(b.dataset.answer);render(true);app.querySelector('[data-answer=\"'+S.answer+'\"]').focus();return}const action=b.dataset.action;if(action==='continue-story')openBook('give',2);if(action==='start-story'){S.index=0;render()}if(action==='back-stories'){S.mode='stories';go('words')}if(action==='reread'){S.index=0;S.answer=null;render()}if(action==='previous'){S.index--;S.playing=false;render()}if(action==='next'){S.playing=false;S.index++;if(S.index===story().pages.length)S.read.add(S.story);render();if(S.index<story().pages.length)notice('预览提示：正式应用将在下一页自动朗读新正文。')}if(action==='listen'){S.playing=S.playing===b.dataset.utterance?false:b.dataset.utterance;render(true);notice(S.playing?'播放状态示意；预览不播放实际声音。':'已停止播放状态示意。')}if(action==='clear'){S.query='';S.filter='all';S.phase='all';render(true)}if(action==='save-sentence'){const v=(S.saved[S.story]||'').trim();document.getElementById('save-status').textContent=v?'Kept in this preview for this visit.':'Write a sentence first.';notice(v?'示意句子已保留在本次预览中。':'请先写一句自己的表达。')}if(action==='word-review')notice('示意：此词将加入复习；不会自动标为已认识。');if(action==='word-known')notice('示意：单词已认识操作与故事已读分别记录。');if(action==='continue-learning'){S.mode='flashcards';go('words')}if(action==='start-review'){S.reviewStarted=true;S.reviewFinished=false;render()}if(action==='review-answer'){if(b.dataset.value==='give'){S.reviewFinished=true;render()}else document.getElementById('review-feedback').textContent='Try again. Which word means to let a friend have something?'}if(action==='flip'){S.flipped=!S.flipped;render(true)}if(action==='chinese')setChinese();if(action==='voice-settings')notice('正式设置保留语音开关、语速及口音；此预览不调用音频。')});
    app.addEventListener('keydown',e=>{const tab=e.target.closest('[data-mode]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const modes=['list','flashcards','library','stories'];let i=modes.indexOf(S.mode);i=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:-1)+4)%4;S.mode=modes[i];render(true);app.querySelector('.mode[aria-selected=true]').focus()});
    render();
  </script>
</body>
</html>
